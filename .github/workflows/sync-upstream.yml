name: Sync upstream
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    if: github.repository == 'kiraje/rea'
    runs-on: ubuntu-latest
    steps:
      - run: gh repo sync ${{ github.repository }} --source morluto/rea --branch main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
